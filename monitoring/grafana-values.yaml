resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 384Mi
persistence:
  enabled: false
service:
  type: ClusterIP
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        uid: victoriametrics
        access: proxy
        url: http://vm-victoria-metrics-single-server.monitoring.svc.cluster.local:8428
        isDefault: true
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: Platform Lab
        type: file
        disableDeletion: false
        options:
          path: /var/lib/grafana/dashboards/default
dashboardsConfigMaps:
  default: grafana-dashboards
