global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'finance-manager-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['app:8080']

  - job_name: 'notification-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['notification-service:8081']

  - job_name: 'python-observer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['observer:9100']
