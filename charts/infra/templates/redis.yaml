apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {app: redis}
spec:
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels: {app: redis}
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      enableServiceLinks: false
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.storage }}
